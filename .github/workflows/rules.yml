name: Engine and rules
on: [push, pull_request]
jobs:
  rules:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install -r requirements-learning.txt
      - run: python tests/learning_data_tests.py
      - run: python tests/neural_training_tests.py
      - run: python tests/classical_evaluation_tests.py
      - run: python tests/learning_loss_analysis_tests.py
      - run: python tests/learning_corpus_tests.py
      - run: python tests/learning_arena_tests.py
      - run: python tests/learning_arena_futility_tests.py
      - run: python tests/learning_registry_tests.py
      - run: python tests/runtime_engine_tests.py
      - run: python tests/boss_openings_tests.py
      - run: python tests/boss_opponent_tests.py
      - run: python tests/poisoned_piece_tests.py
      - run: python tests/boss_play_tests.py
      - run: python tests/boss_play_state_tests.py
      - run: python tests/boss_archive_tests.py
      - run: python tests/boss_strength_match_tests.py
      - run: python tests/boss_strength_summary_tests.py
      - run: python tests/boss_mode_match_tests.py
      - run: python tests/learning_cycle_tests.py
      - run: python tests/teacher_quality_tests.py
      - run: python tests/neural_cost_diagnostic_tests.py
      - run: python tests/neural_inference_benchmark_tests.py
      - run: python tests/endgame_diagnosis_tests.py
      - run: python tests/endgame_data_tests.py
      - run: python tests/endgame_holdout_quality_tests.py
      - run: python tests/endgame_learning_curve_tests.py
      - run: python tests/endgame_matches_tests.py
      - run: python tests/endgame_study_tests.py
      - run: python tests/endgame_study_resume_tests.py
      - run: python tests/endgame_remote_study_tests.py
      - run: python tests/remote_learning_arena_tests.py
      - run: python tests/remote_arena_import_tests.py
      - run: python tests/m1_source_inventory_tests.py
      - run: python tests/neural_training_unit_tests.py
      - run: python tests/neural_qat_tests.py
      - run: python tests/neural_precision_tests.py
      - run: python tests/neural_stm_tests.py
      - run: python tests/stockfish_teacher_tests.py
      - run: python tests/evaluation_comparison_tests.py
      - run: python tests/opening_variety_tests.py
      - run: python tests/windows_speech_tests.py
      - run: python tests/neural_stm_guarded_tests.py
      - run: python tests/neural_diverse_bank_tests.py
      - run: python tests/nnue_diverse_training_tests.py
      - run: python tests/nnue_loss_repair_training_tests.py
      - run: python tests/neural_stm_ordering_tests.py
      - run: python tests/nnue_ordering_data_tests.py
      - run: python tests/nnue_ordering_gate_tests.py
      - run: python tests/neural_stm_generalization_tests.py
      - run: python tests/nnue_generalization_gate_tests.py
      - run: python tests/nnue_leaf_data_tests.py
      - run: python tests/nnue_leaf_gate_tests.py
      - run: python tests/neural_stm_preservation_tests.py
      - run: python tests/neural_stm_preservation_step_tests.py
      - run: python tests/nnue_choice_gate_tests.py
      - run: python tests/nnue_choice_pairs_tests.py
      - run: python tests/neural_stm_output_only_tests.py
      - run: python tests/nnue_head_repair_gate_tests.py
      - run: python tests/nnue_tactical_search_gate_tests.py
      - run: python tests/nnue_qsearch_cost_gate_tests.py
      - run: python tests/nnue_reply_budget_gate_tests.py
      - run: python tests/nnue_live_pairs_tests.py
      - run: python tests/neural_strength_driver_tests.py
      - run: python tests/neural_long_time_driver_tests.py
      - run: python tests/neural_target_ab_data_tests.py
      - run: python tests/neural_target_ab_training_tests.py
      - run: python tests/neural_target_ab_match_tests.py
      - run: python tests/neural_target_ab_audit_tests.py
      - run: python tests/neural_target_ab_v2_audit_tests.py
      - run: python -m unittest discover -s tests/neural_search_data -v
      - name: Build neural cost diagnostic
        run: cmake --build build --config Release --target regicide_profile_neural
      - if: runner.os == 'Linux'
        run: python tests/neural_integration_tests.py --binary build/regicide
      - if: runner.os == 'Windows'
        run: python tests/neural_integration_tests.py --binary build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/learning_runtime_tests.py --binary build/regicide
      - if: runner.os == 'Windows'
        run: python tests/learning_runtime_tests.py --binary build/Release/regicide.exe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/human-play/app.js
      - run: node tests/web_hint_tests.js
      - run: node tests/think_time_web_tests.js
      - run: node tests/rapid_clock_web_tests.js
      - run: node tests/boss_mode_web_tests.js
      - run: node tests/opening_guide_web_tests.js
      - run: node --check web/human-play/explorer.js
      - run: node tests/opening_explorer_web_tests.js
      - run: node tests/web_analysis_tests.js
      - run: node tests/web_board_motion_tests.js
      - run: node tests/web_coaching_tests.js
      - run: python tests/analysis_tests.py
      - run: python tests/analysis_castling_tests.py
      - run: python tests/analysis_castling_workflow_tests.py
      - run: python tests/analysis_evaluation_tests.py
      - run: python tests/coaching_tests.py
      - run: python tests/coach_explanations_tests.py
      - run: python tests/character_coach_tests.py
      - run: python tests/opening_guide_tests.py
      - run: python tests/opening_guide_integration_tests.py
      - run: python tests/opening_explorer_tests.py
      - run: python tests/opening_explorer_http_tests.py
      - run: python tests/pgn_preview_tests.py
      - run: python tests/engine_profile_tests.py
      - run: python tests/external_baseline_matrix_tests.py
      - run: python tests/m2_formal_tests.py
      - run: python tests/m2_load_guard_tests.py
      - run: python tests/m2_formal_openings_tests.py
      - run: python tests/neural_huber_tests.py
      - run: python tests/think_time_tests.py
      - run: python tests/game_clock_tests.py
      - run: python tests/rapid_clock_host_tests.py
      - run: python tests/rapid_clock_archive_tests.py
      - run: python tests/decision_support_tests.py
      - run: python tests/engine_pacing_tests.py
      - run: python tests/pacing_v4_tests.py
      - run: python tests/contrast_pacing_tests.py
      - run: python tests/opening_pacing_tests.py
      - run: python tests/human_rhythm_tests.py
      - run: python tests/human_rhythm_host_tests.py
      - run: python tests/human_rhythm_diagnostic_tests.py
      - run: python tests/engine_only_clock_tests.py
      - run: python tests/decision_clarity_tests.py
      - run: python tests/installed_think_time_stream_tests.py
      - run: python tests/evaluation_state_tests.py
      - run: python tests/sparring_evaluation_tests.py
      - run: python tests/sparring_evaluation_state_tests.py
      - run: python tests/sparring_evaluation_live_tests.py
      - run: python tests/sparring_play_tests.py
      - run: python tests/rating_evidence_tests.py
      - run: python tests/rating_observation_host_tests.py
      - run: python tests/sparring_rating_tests.py
      - run: python tests/sparring_rating_v2_tests.py
      - run: python tests/sparring_rating_state_tests.py
      - if: runner.os == 'Linux'
        run: python tests/sparring_evaluation_integration.py --binary build/regicide --output build/sparring-evaluation-integration
      - if: runner.os == 'Windows'
        run: python tests/sparring_evaluation_integration.py --binary build/Release/regicide.exe --output build/sparring-evaluation-integration
      - run: python tests/audit_pvs_results.py --self-test
      - run: python tests/audit_see_results.py --self-test
      - run: python tests/see_clean_guard_tests.py
      - run: python tests/audit_see_replication.py --self-test
      - run: python tests/audit_see_cost_results.py --self-test
      - name: Build optional static evaluation diagnostic probe
        run: cmake --build build --config Release --target regicide_evaluation_probe
      - if: runner.os == 'Linux'
        run: python tests/loss_diagnosis_tests.py --binary build/regicide --probe build/regicide_evaluation_probe
      - if: runner.os == 'Windows'
        run: python tests/loss_diagnosis_tests.py --binary build/Release/regicide.exe --probe build/Release/regicide_evaluation_probe.exe
      - if: runner.os == 'Linux'
        run: python tests/classical_evaluation_tests.py --probe build/regicide_evaluation_probe
      - if: runner.os == 'Windows'
        run: python tests/classical_evaluation_tests.py --probe build/Release/regicide_evaluation_probe.exe
      - if: runner.os == 'Linux'
        run: python tests/differential.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/differential.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/engine_integration.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/engine_integration.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/game_runner_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/game_runner_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/compare_engines_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/compare_engines_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/benchmark_search_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/benchmark_search_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/human_play_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/human_play_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/hint_state_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/hint_state_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/handicap_play_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/handicap_play_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/game_archive_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/game_archive_tests.py build/Release/regicide.exe
      - if: runner.os == 'Linux'
        run: python tests/godot_bootstrap_tests.py build/regicide
      - if: runner.os == 'Windows'
        run: python tests/godot_bootstrap_tests.py build/Release/regicide.exe
      - name: Install pinned official Godot for scene checks
        shell: pwsh
        run: ./scripts/install_test_godot.ps1
      - name: Godot perspective and live engine checks
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'build/Release/regicide.exe' } else { 'build/regicide' }
          python tests/godot_integration_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/handicap_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/archive_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/hint_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/opening_guide_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/pgn_file_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/analysis_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/coaching_godot_tests.py --godot "$env:REGICIDE_TEST_GODOT" --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/board_motion_tests.py --godot "$env:REGICIDE_TEST_GODOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:REGICIDE_TEST_GODOT" --headless --path godot --script res://tests/boss_mode_offline_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:REGICIDE_TEST_GODOT" --headless --path godot --script res://tests/rapid_clock_offline_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:REGICIDE_TEST_GODOT" --headless --path godot --script res://tests/engine_pacing_transport_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:REGICIDE_TEST_GODOT" --headless --path godot --script res://tests/opening_explorer_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/opening_explorer_integration_tests.py --binary $binary --godot "$env:REGICIDE_TEST_GODOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/rapid_clock_live_tests.py --binary $binary --output build/rapid-clock-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/coaching_http_tests.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Both neural model families and learning paths
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'build/Release/regicide.exe' } else { 'build/regicide' }
          $modelTests = if ($IsWindows) { 'build/Release/regicide_neural_model_tests.exe' } else { 'build/regicide_neural_model_tests' }
          python tests/nnue_integration_tests.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/neural_training_integration.py --engine $binary --model-tests $modelTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/neural_qat_integration.py --engine $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/neural_precision_integration.py --engine $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/neural_precision_experiment_tests.py --engine $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/neural_coexistence_integration.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/m1_engine_parity.py --binary $binary --output build/m1-protocol.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/think_time_live_tests.py --binary $binary --godot "$env:REGICIDE_TEST_GODOT" --output build/m1-think-time.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
